<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="auto" direction="rtl">
  <defs>
    <linearGradient id="bgGrad1" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f9d9a" />
      <stop offset="50%" stop-color="#0a7471" />
      <stop offset="100%" stop-color="#12284c" />
    </linearGradient>
    <radialGradient id="glow" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#12284c" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="800" height="240" rx="20" fill="url(#bgGrad1)" />
  <rect width="800" height="240" rx="20" fill="url(#glow)" />
  
  <!-- Subtle decorative grid -->
  <g stroke="#ffffff" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="60" x2="800" y2="60" />
    <line x1="0" y1="120" x2="800" y2="120" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="200" y1="0" x2="200" y2="240" />
    <line x1="400" y1="0" x2="400" y2="240" />
    <line x1="600" y1="0" x2="600" y2="240" />
  </g>

  <!-- Illustration Graphic on Left in RTL -->
  <g transform="translate(140, 120)">
    <circle r="70" fill="none" stroke="#5eead4" stroke-opacity="0.25" stroke-width="2" />
    <circle r="50" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="6 4" />
    <circle r="36" fill="#ffffff" fill-opacity="0.15" />
    <circle r="26" fill="#ffffff" />
    <path d="M-8 0 h16 M0 -8 v16" stroke="#0f9d9a" stroke-width="4" stroke-linecap="round" />
    <g transform="translate(25, -35)">
      <rect x="0" y="0" width="38" height="20" rx="10" fill="#fde047" />
      <text x="19" y="14" text-anchor="middle" font-family="'Vazirmatn', sans-serif" font-weight="800" font-size="11" fill="#12284c">۲۴/۷</text>
    </g>
  </g>

  <!-- Typography on Right in RTL -->
  <g transform="translate(750, 48)">
    <!-- Badge -->
    <rect x="-140" y="0" width="140" height="26" rx="13" fill="#ffffff" fill-opacity="0.2" />
    <text x="-70" y="18" text-anchor="middle" font-family="'Vazirmatn', sans-serif" font-weight="700" font-size="12" fill="#5eead4">شبکه سراسری نرسیکا</text>
    
    <text x="0" y="58" text-anchor="start" font-family="'Vazirmatn', sans-serif" font-weight="900" font-size="25" fill="#ffffff">اعزام فوری پرستار متخصص در کمتر از ۴۵ دقیقه</text>
    <text x="0" y="90" text-anchor="start" font-family="'Vazirmatn', sans-serif" font-weight="500" font-size="14" fill="#e6f6f5">ارزیابی کامل صلاحیت علمی، اخلاقی و بالینی همراه با نظارت مستمر پزشکی</text>
    
    <g transform="translate(0, 114)">
      <rect x="-180" y="0" width="180" height="34" rx="10" fill="#ffffff" />
      <text x="-90" y="22" text-anchor="middle" font-family="'Vazirmatn', sans-serif" font-weight="800" font-size="13" fill="#0f9d9a">مشاهده سوابق و امتیازها ←</text>
    </g>
  </g>
</svg>
