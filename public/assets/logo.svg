<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f9d9a" />
      <stop offset="100%" stop-color="#12284c" />
    </linearGradient>
  </defs>
  <!-- Medical Shield Icon -->
  <g transform="translate(10, 5)">
    <rect x="0" y="0" width="50" height="50" rx="14" fill="url(#shieldGrad)" />
    <!-- Medical Cross -->
    <path d="M25 14 v22 M14 25 h22" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" />
    <!-- Heart pulse line -->
