  </g>
  <!-- Text Brand -->
  <text x="70" y="32" font-family="'Vazirmatn', sans-serif" font-weight="900" font-size="24" fill="#12284c">نرسیکا</text>
  <text x="70" y="47" font-family="'Vazirmatn', sans-serif" font-weight="600" font-size="10" fill="#0f9d9a">NERSIKA CARE</text>
</svg>
