      <stop offset="0%" stop-color="#12284c" />
      <stop offset="60%" stop-color="#163b6d" />
      <stop offset="100%" stop-color="#0a7471" />
    </linearGradient>
  </defs>
  <rect width="800" height="220" rx="20" fill="url(#bgGrad2)" />

  <!-- Shield & Trust badge on left in RTL -->
  <g transform="translate(130, 110)">
